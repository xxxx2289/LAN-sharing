name: Build LanRemote Android APK

on:
  push:
    paths:
      - 'LanRemote-WebRTC.zip'
      - 'project-bundle.zip'
      - '.github/workflows/build.yml'
      - '**/*.kt'
      - '**/*.kts'
      - 'app/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file=""
          for f in LanRemote-WebRTC.zip project-bundle.zip; do
            if [[ -f "$f" ]]; then
              zip_file="$f"
              break
            fi
          done

          if [[ -n "$zip_file" ]]; then
            mkdir -p _extract
            unzip -oq "$zip_file" -d _extract

            settings_file="$(find _extract -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: settings.gradle.kts was not found inside $zip_file"
              find _extract -maxdepth 4 -type f | head -80
              exit 1
            fi

            project_dir="$(dirname "$settings_file")"
            echo "Extracted project directory: $project_dir"
            cp -a "$project_dir"/. .
          fi

          if [[ ! -f settings.gradle.kts ]]; then
            echo "ERROR: No settings.gradle.kts at repository root after extraction."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Package complete source archive
        run: |
          zip -qr LanRemote-WebRTC-source.zip . \
            -x '.git/*' '.gradle/*' 'app/build/*' '_extract/*' \
               'LanRemote-WebRTC.zip' 'project-bundle.zip'

      - uses: actions/upload-artifact@v4
        with:
          name: LanRemote-WebRTC-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            LanRemote-WebRTC-source.zip
          if-no-files-found: error
          retention-days: 30
