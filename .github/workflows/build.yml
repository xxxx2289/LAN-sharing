
name: Build LanRemote Android APK

on:
  push:
    paths:
      - 'LanRemote-WebRTC.zip'
      - 'project-bundle.zip'
      - '.github/workflows/build.yml'
      - '**/*.kt'
      - '**/*.kts'
      - 'app/src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 自动解压上传的 Android 项目 ZIP
      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail

          zip_file=""

          for f in LanRemote-WebRTC.zip project-bundle.zip; do
            if [[ -f "$f" ]]; then
              zip_file="$f"
              break
            fi
          done

          if [[ -n "$zip_file" ]]; then
            mkdir -p _extract
            unzip -oq "$zip_file" -d _extract

            settings_file="$(find _extract -type f -name settings.gradle.kts -print -quit)"

            if [[ -z "$settings_file" ]]; then
              echo "ERROR: settings.gradle.kts was not found inside $zip_file"
              find _extract -maxdepth 5 -type f | head -100
              exit 1
            fi

            project_dir="$(dirname "$settings_file")"

            echo "Extracted project directory: $project_dir"

            cp -a "$project_dir"/. .
          fi

          if [[ ! -f settings.gradle.kts ]]; then
            echo "ERROR: No settings.gradle.kts at repository root after extraction."
            echo "Upload LanRemote-WebRTC.zip or project-bundle.zip to the repository root."
            exit 1
          fi

      # 3. 配置 JDK 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. 配置 Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools,platforms;android-35,build-tools;35.0.0"

      # 6. 接受 Android SDK 许可证
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # 7. 编译 Android APK
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      # 8. 打包完整源码 ZIP
      - name: Package complete source archive
        shell: bash
        run: |
          set -euo pipefail

          zip -qr LanRemote-WebRTC-source.zip . \
            -x '.git/*' '.gradle/*' 'app/build/*' '_extract/*' \
               'LanRemote-WebRTC.zip' 'project-bundle.zip' \
               'LanRemote-WebRTC-source.zip'

      # 9. 上传 APK 和完整源码 ZIP
      - name: Upload APK and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LanRemote-WebRTC-artifacts
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            LanRemote-WebRTC-source.zip
          if-no-files-found: error
          retention-days: 30
